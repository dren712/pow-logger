name: Test Protocol & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Verification
        run: npx tsc --noEmit --skipLibCheck

      - name: ESLint Check
        run: npm run lint

      - name: Protocol Security Test Suite
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy-test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
        run: |
          npx tsc --skipLibCheck tests/protocol.test.ts --outDir .dist-test --module commonjs --target es2020 --moduleResolution node --esModuleInterop --noEmit false
          node .dist-test/tests/protocol.test.js
          rm -rf .dist-test

      - name: Next.js Production Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build
